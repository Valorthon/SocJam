services:
  postgres:
    image: postgres:16-alpine
    container_name: omnipost-postgres
    environment:
      POSTGRES_USER: omnipost
      POSTGRES_PASSWORD: omnipost
      POSTGRES_DB: omnipost
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipost -d omnipost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
