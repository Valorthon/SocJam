services:
  postgres:
    image: postgres:16-alpine
    container_name: socjam-postgres
    environment:
      POSTGRES_USER: socjam
      POSTGRES_PASSWORD: socjam
      POSTGRES_DB: socjam
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socjam -d socjam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
